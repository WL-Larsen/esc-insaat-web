title: Kentsel Dönüşüm
summary: Riskli yapıları güvenli, modern ve değeri artmış binalara dönüştürüyoruz.
description: |
  Hak sahipleriyle şeffaf bir süreç yürütüyor; risk tespitinden yıkıma, ruhsattan teslimata kadar tüm adımları sizin adınıza koordine ediyoruz.

  Her aşamada hak sahiplerini bilgilendiriyor, sözleşmede belirlenen takvime sadık kalıyoruz.
icon: urban
features:
  - Risk tespiti ve ruhsat süreçleri
  - Hak sahipleriyle şeffaf sözleşme
  - Kira yardımı ve süreç danışmanlığı
order: 2
