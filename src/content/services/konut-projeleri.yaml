title: Konut Projeleri
summary: Modern mimari ve işlevsel planlarla aileler için güvenli yaşam alanları üretiyoruz.
description: |
  Arsa seçiminden teslimata kadar konut projelerinin tüm süreçlerini yönetiyoruz. Depreme dayanıklı yapı tasarımı, enerji verimliliği ve kullanışlı daire planları önceliklerimiz arasında.

  Satış öncesinde ve sonrasında alıcılarımızı düzenli olarak bilgilendiriyor, teslim sonrası destekle süreci tamamlıyoruz.
icon: building
features:
  - Depreme dayanıklı yapı tasarımı
  - Enerji verimli cephe ve yalıtım
  - Sosyal donatı ve otopark planlaması
order: 1
